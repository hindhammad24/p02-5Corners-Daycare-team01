<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>5CornersDaycare</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/layout.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Coming+Soon&amp;family=Nunito:ital,wght@0,200..1000;1,200..1000&amp;family=Sour+Gummy:ital,wght@0,100..900;1,100..900&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="location-page" id="top">
    <!--FIXED TOP NAVIGATION BAR-->
    <header class="navbar">
      <div class="topbar-inner">
        <button class="menu-toggle" aria-label="Open menu">☰</button>
        <!-- inner container to control width and alignment -->
        <!-- LOGO -->
        <a class="logo" href="index.html">
          <!--clicking it returns to home-->
          <img alt="5 corners daycare logo" src="img/logo.jpg" />
          <!--logo image-->
        </a>
        <!-- NAVIGATION -->
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="programs.html">Programs</a>
          <a href="technology.html">Technology</a>
          <a href="contact.html">Contact Us</a>
          <a href="location.html">Location &amp; Hours</a>

          <!-- WhatsApp -->
          <a
            class="nav-social"
            href="https://wa.me/16044965050"
            target="_blank"
            rel="noopener"
            aria-label="Message 5 Corners Daycare on WhatsApp"
          >
            <img src="img/whatsapp_icon.png" alt="" />
          </a>

          <!-- Instagram -->
          <a
            class="nav-social"
            href="https://www.instagram.com/5corners_daycare/"
            target="_blank"
            rel="noopener"
            aria-label="5 Corners Daycare on Instagram"
          >
            <img src="img/icon_insta.webp" alt="" />
          </a>

          <!-- Book a Tour -->
          <a class="tour-button" href="contact.html">Book a Tour</a>
        </nav>
      </div>
    </header>
    <main class="container">
      <h2 class="hero">Location &amp; Hours</h2>
      <p class="lead">Visit us or find directions below.</p>
      <section class="element location-layout">
        <!-- LEFT SIDE: Address Info -->
        <div class="location-info">
          <h3>Our Address</h3>
          <p>
            13620 Grosvenor Rd<br />
            Surrey, BC<br />
            Canada V3R 5C9
          </p>
          <p>
            <strong>Phone:</strong>
            <a class="intext-link" href="tel:+16044965050">(604) 496-5050</a>
          </p>
          <p>
            <strong>Hours of Operation:</strong><br />
            Monday to Friday<br />
            7:00 am – 6:00 pm
          </p>
          <p>
            <a
              class="button"
              href="https://www.google.com/maps/search/?api=1&amp;query=13620+Grosvenor+Rd+Surrey+BC+Canada+V3R+5C9"
              target="_blank"
            >
              Open in Google Maps
            </a>
          </p>
        </div>
        <!-- RIGHT SIDE: Embedded Map -->
        <div class="location-map">
          <iframe
            allowfullscreen=""
            class="map-embed"
            loading="lazy"
            src="https://www.google.com/maps?q=13620+Grosvenor+Rd+Surrey+BC+Canada+V3R+5C9&amp;output=embed"
            style="border: 0"
          >
          </iframe>
        </div>
      </section>
    </main>
    <script>
      const menuButton = document.querySelector(".menu-toggle");
      const nav = document.querySelector(".nav");

      menuButton.addEventListener("click", () => {
        nav.classList.toggle("active");
      });
    </script>
  </body>
</html>
